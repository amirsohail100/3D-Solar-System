<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System with Dynamic Space Fabric Polygons</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- GSAP for Smooth Camera Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #020208; color: white; user-select: none; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }
        
        select option { background: #0f172a; color: white; }
    </style>
</head>
<body>

    <!-- UI Panel -->
    <div id="ui-panel" class="glass-panel absolute top-6 left-6 w-80 rounded-2xl p-6 z-10 transition-all duration-300 max-h-[90vh] overflow-y-auto">
        <h1 class="text-2xl font-bold mb-1 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-teal-300 to-emerald-400">Solar System</h1>
        <p class="text-xs text-gray-400 mb-5">Dynamic Fabric & Proportional Scale</p>

        <!-- Controls Container -->
        <div class="space-y-4 text-sm">
            
            <!-- Focus Target Dropdown -->
            <div>
                <label class="block text-gray-300 mb-1 font-medium">Focus Target</label>
                <select id="planet-select" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-white outline-none focus:border-blue-400 transition-colors cursor-pointer">
                    <option value="System">Full Solar System</option>
                    <option value="Sun">The Sun</option>
                    <option value="Mercury">Mercury</option>
                    <option value="Venus">Venus</option>
                    <option value="Earth">Earth</option>
                    <option value="Moon">↳ Earth's Moon</option>
                    <option value="Mars">Mars</option>
                    <option value="Jupiter">Jupiter</option>
                    <option value="Io">↳ Jupiter's Io</option>
                    <option value="Europa">↳ Jupiter's Europa</option>
                    <option value="Saturn">Saturn</option>
                    <option value="Titan">↳ Saturn's Titan</option>
                    <option value="Uranus">Uranus</option>
                    <option value="Neptune">Neptune</option>
                </select>
            </div>

            <!-- UI ZOOM SLIDER & BUTTONS -->
            <div>
                <div class="flex justify-between text-gray-300 mb-1">
                    <label class="font-medium">Camera Zoom</label>
                    <span id="zoom-display" class="font-mono text-blue-300">1200</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-zoom-in" title="Zoom In" class="bg-white/10 hover:bg-blue-600 active:scale-95 text-white w-9 h-8 rounded-lg border border-white/20 font-bold text-base transition-all flex items-center justify-center">
                        +
                    </button>
                    <input type="range" id="zoom-slider" min="10" max="3500" value="1200" class="w-full accent-blue-500 cursor-pointer h-2 bg-white/20 rounded-lg appearance-none">
                    <button id="btn-zoom-out" title="Zoom Out" class="bg-white/10 hover:bg-blue-600 active:scale-95 text-white w-9 h-8 rounded-lg border border-white/20 font-bold text-base transition-all flex items-center justify-center">
                        -
                    </button>
                </div>
            </div>

            <!-- Play / Pause -->
            <div class="flex items-center justify-between">
                <span class="text-gray-300 font-medium">Orbital Motion</span>
                <button id="btn-play-pause" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white px-4 py-1.5 rounded-md transition-all w-20 text-center font-semibold">
                    Pause
                </button>
            </div>

            <!-- Simulation Speed Slider -->
            <div>
                <div class="flex justify-between text-gray-300 mb-1">
                    <label class="font-medium">Simulation Speed</label>
                    <span id="speed-display" class="font-mono text-blue-300">1.0x</span>
                </div>
                <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1" class="w-full accent-blue-500 cursor-pointer">
            </div>

            <!-- Show/Hide Orbit Lines -->
            <div class="flex items-center justify-between">
                <span class="text-gray-300 font-medium">Show Orbit Lines</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="toggle-orbits" class="sr-only peer" checked>
                    <div class="w-11 h-6 bg-gray-700 rounded-full peer peer-checked:bg-blue-500 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                </label>
            </div>

            <!-- SPACE FABRIC (GENERAL RELATIVITY) TOGGLE -->
            <div class="flex items-center justify-between pt-2 border-t border-white/10">
                <div>
                    <span class="text-purple-300 font-semibold block">Space Fabric</span>
                    <span class="text-[10px] text-gray-400 block" id="fabric-poly-info">Dynamic Polys: Auto</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="toggle-fabric" class="sr-only peer">
                    <div class="w-11 h-6 bg-gray-700 rounded-full peer peer-checked:bg-purple-600 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                </label>
            </div>
        </div>

        <div class="mt-5 pt-3 border-t border-white/10 text-xs text-gray-400 space-y-1.5">
            <p>🌌 <b>Realistic Spacing:</b> Distances scaled to AU ratio</p>
            <p>⚡ <b>Dynamic LOD Fabric:</b> Polys reduce on zoom-out</p>
            <p>🎯 <b>Click Planet / Moon:</b> Auto Focus Target</p>
        </div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==========================================
        // 1. PROCEDURAL TEXTURES
        // ==========================================
        function createSunTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0, '#ff4500'); grad.addColorStop(0.5, '#ffaa00'); grad.addColorStop(1, '#ff2200');
            ctx.fillStyle = grad; ctx.fillRect(0,0,1024,512);
            for(let i=0; i<3000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,220,0.3)' : 'rgba(200,30,0,0.25)';
                ctx.beginPath(); ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*12 + 2, 0, Math.PI*2); ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createMercuryTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#8a8a8a'; ctx.fillRect(0,0,1024,512);
            for(let i=0; i<3000; i++) {
                ctx.fillStyle = Math.random() > 0.4 ? 'rgba(40,40,40,0.3)' : 'rgba(220,220,220,0.3)';
                ctx.beginPath(); ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*10 + 1, 0, Math.PI*2); ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createVenusTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0, '#e5b869'); grad.addColorStop(0.5, '#f7d998'); grad.addColorStop(1, '#d69e47');
            ctx.fillStyle = grad; ctx.fillRect(0,0,1024,512);
            ctx.fillStyle = 'rgba(255, 245, 220, 0.2)';
            for(let i=0; i<50; i++) {
                ctx.beginPath(); ctx.ellipse(Math.random()*1024, Math.random()*512, Math.random()*300+100, Math.random()*20+5, Math.random()*0.2, 0, Math.PI*2); ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1c538e'; ctx.fillRect(0,0,1024,512);
            ctx.fillStyle = '#2e7d32';
            for(let i=0; i<200; i++) {
                ctx.beginPath(); ctx.ellipse(Math.random()*1024, 80 + Math.random()*352, Math.random()*90+20, Math.random()*50+10, Math.random()*Math.PI, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            for(let i=0; i<100; i++) {
                ctx.beginPath(); ctx.ellipse(Math.random()*1024, Math.random()*512, Math.random()*140+30, Math.random()*12+4, Math.random()*0.3, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 1024, 30); ctx.fillRect(0, 482, 1024, 30);
            return new THREE.CanvasTexture(canvas);
        }

        function createMoonTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#a3a3a3'; ctx.fillRect(0,0,512,256);
            for(let i=0; i<1000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(50,50,50,0.3)' : 'rgba(230,230,230,0.3)';
                ctx.beginPath(); ctx.arc(Math.random()*512, Math.random()*256, Math.random()*6 + 1, 0, Math.PI*2); ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createMarsTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#d14a14'; ctx.fillRect(0,0,1024,512);
            ctx.fillStyle = 'rgba(70, 20, 5, 0.4)';
            for(let i=0; i<250; i++) {
                ctx.beginPath(); ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*40+8, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.ellipse(512, 12, 500, 18, 0, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(512, 500, 500, 18, 0, 0, Math.PI*2); ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        function createJupiterTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const bands = ['#d8c2a3', '#9e7b5a', '#e2cca8', '#b5855c', '#ebdcc3', '#7a5438'];
            for(let y=0; y<512; y+=8) {
                ctx.fillStyle = bands[Math.floor(y/8) % bands.length];
                ctx.fillRect(0, y, 1024, 8);
            }
            ctx.fillStyle = '#c83b12';
            ctx.beginPath(); ctx.ellipse(650, 320, 55, 32, -0.1, 0, Math.PI*2); ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        function createSaturnTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const bands = ['#ebd8b7', '#d2b88f', '#e5d1b0', '#c4a67b', '#f0dfbf'];
            for(let y=0; y<512; y+=6) {
                ctx.fillStyle = bands[Math.floor(y/6) % bands.length];
                ctx.fillRect(0, y, 1024, 6);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createSaturnRingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 1;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 512, 0);
            grad.addColorStop(0.0, 'rgba(220, 200, 160, 0.0)');
            grad.addColorStop(0.15, 'rgba(240, 220, 180, 0.95)');
            grad.addColorStop(0.55, 'rgba(190, 170, 130, 0.9)');
            grad.addColorStop(0.65, 'rgba(10, 10, 10, 0.2)');
            grad.addColorStop(0.72, 'rgba(220, 200, 160, 0.85)');
            grad.addColorStop(0.98, 'rgba(160, 140, 100, 0.4)');
            grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 1);
            return new THREE.CanvasTexture(canvas);
        }

        function createUranusTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0, '#6ba4f8'); grad.addColorStop(0.5, '#8cd3f5'); grad.addColorStop(1, '#6ba4f8');
            ctx.fillStyle = grad; ctx.fillRect(0,0,1024,512);
            return new THREE.CanvasTexture(canvas);
        }

        function createNeptuneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0, '#2552c7'); grad.addColorStop(0.5, '#3b6be8'); grad.addColorStop(1, '#2552c7');
            ctx.fillStyle = grad; ctx.fillRect(0,0,1024,512);
            ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(150, 160, 450, 5);
            return new THREE.CanvasTexture(canvas);
        }

        // ==========================================
        // 2. SCENE & LIGHTING
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 500, 1200);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.5;
        controls.zoomSpeed = 0.3;
        controls.minDistance = 2;
        controls.maxDistance = 4500;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x222244, 0.5);
        scene.add(hemiLight);

        const sunLight = new THREE.PointLight(0xffffff, 20000, 5000);
        scene.add(sunLight);

        // ==========================================
        // 3. STARFIELD
        // ==========================================
        const starsCount = 7000;
        const starsGeo = new THREE.BufferGeometry();
        const posArray = new Float32Array(starsCount * 3);
        const colorArray = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount; i++) {
            const r = 2000 + Math.random() * 3000;
            const theta = 2 * Math.PI * Math.random();
            const phi = Math.acos(2 * Math.random() - 1);

            posArray[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i * 3 + 2] = r * Math.cos(phi);

            const color = new THREE.Color();
            const p = Math.random();
            if (p > 0.8) color.setHex(0x99ddff);
            else if (p > 0.6) color.setHex(0xffe0aa);
            else color.setHex(0xffffff);

            colorArray[i * 3] = color.r;
            colorArray[i * 3 + 1] = color.g;
            colorArray[i * 3 + 2] = color.b;
        }

        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        starsGeo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

        const starsMat = new THREE.PointsMaterial({
            size: 2.2,
            sizeAttenuation: true,
            vertexColors: true,
            transparent: true,
            opacity: 1.0
        });

        const starMesh = new THREE.Points(starsGeo, starsMat);
        scene.add(starMesh);

        // ==========================================
        // 4. PLANETS & MOONS DATA
        // ==========================================
        const sphereGeo = new THREE.SphereGeometry(1, 64, 64);
        const interactableObjects = [];
        const orbitLines = [];
        const moonTexture = createMoonTexture();

        const sunRadius = 25;
        const sunMass = 120;
        const sunGroup = new THREE.Group();
        const sunMat = new THREE.MeshBasicMaterial({ map: createSunTexture() });
        const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(sunRadius, 64, 64), sunMat);
        sunMesh.userData = { name: 'Sun', radius: sunRadius, mass: sunMass };
        sunGroup.add(sunMesh);
        interactableObjects.push(sunMesh);

        const glowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, side: THREE.BackSide });
        const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(sunRadius + 4, 64, 64), glowMat);
        const sunGlowOuter = new THREE.Mesh(new THREE.SphereGeometry(sunRadius + 12, 64, 64), 
            new THREE.MeshBasicMaterial({ color: 0xff3300, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending, side: THREE.BackSide })
        );
        sunGroup.add(sunGlow); sunGroup.add(sunGlowOuter);
        scene.add(sunGroup);

        const planetsData = [
            { name: 'Mercury', radius: 1.2, distance: 75, mass: 15, speed: 0.035, rotSpeed: 0.01, texture: createMercuryTexture(), roughness: 0.7 },
            { name: 'Venus', radius: 2.2, distance: 110, mass: 22, speed: 0.022, rotSpeed: -0.004, texture: createVenusTexture(), roughness: 0.4 },
            { 
                name: 'Earth', radius: 2.5, distance: 150, mass: 25, speed: 0.015, rotSpeed: 0.02, texture: createEarthTexture(), roughness: 0.3,
                moons: [{ name: 'Moon', radius: 0.6, distance: 6, speed: 0.04 }]
            },
            { 
                name: 'Mars', radius: 1.6, distance: 210, mass: 18, speed: 0.011, rotSpeed: 0.018, texture: createMarsTexture(), roughness: 0.7,
                moons: [
                    { name: 'Phobos', radius: 0.3, distance: 3.5, speed: 0.07 },
                    { name: 'Deimos', radius: 0.25, distance: 5.0, speed: 0.05 }
                ]
            },
            { 
                name: 'Jupiter', radius: 9.0, distance: 420, mass: 65, speed: 0.005, rotSpeed: 0.04, texture: createJupiterTexture(), roughness: 0.5,
                moons: [
                    { name: 'Io', radius: 0.7, distance: 14, speed: 0.05 },
                    { name: 'Europa', radius: 0.6, distance: 17, speed: 0.04 },
                    { name: 'Ganymede', radius: 0.9, distance: 21, speed: 0.03 },
                    { name: 'Callisto', radius: 0.8, distance: 25, speed: 0.02 }
                ]
            },
            { 
                name: 'Saturn', radius: 7.5, distance: 650, mass: 50, speed: 0.003, rotSpeed: 0.038, texture: createSaturnTexture(), roughness: 0.4,
                rings: { inner: 10, outer: 19, texture: createSaturnRingTexture() },
                moons: [{ name: 'Titan', radius: 0.85, distance: 24, speed: 0.025 }]
            },
            { name: 'Uranus', radius: 4.5, distance: 1000, mass: 35, speed: 0.0018, rotSpeed: -0.03, texture: createUranusTexture(), roughness: 0.3,
              rings: { inner: 6, outer: 8.5, texture: createSaturnRingTexture() } },
            { name: 'Neptune', radius: 4.2, distance: 1350, mass: 35, speed: 0.001, rotSpeed: 0.032, texture: createNeptuneTexture(), roughness: 0.3 }
        ];

        const planets = [];
        const allMoons = [];

        planetsData.forEach(data => {
            const points = [];
            for (let i = 0; i <= 256; i++) {
                const angle = (i / 256) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(angle) * data.distance, 0, Math.sin(angle) * data.distance));
            }
            const pathGeo = new THREE.BufferGeometry().setFromPoints(points);
            const orbitLine = new THREE.Line(pathGeo, new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.3 }));
            scene.add(orbitLine);
            orbitLines.push(orbitLine);

            const mat = new THREE.MeshStandardMaterial({ map: data.texture, roughness: data.roughness, metalness: 0.05 });
            const mesh = new THREE.Mesh(sphereGeo, mat);
            mesh.scale.setScalar(data.radius);
            mesh.userData = { name: data.name, radius: data.radius, mass: data.mass };
            
            const startAngle = Math.random() * Math.PI * 2;
            mesh.position.set(Math.cos(startAngle) * data.distance, 0, Math.sin(startAngle) * data.distance);

            if (data.rings) {
                const ringGeo = new THREE.RingGeometry(data.rings.inner, data.rings.outer, 64);
                let pos = ringGeo.attributes.position;
                let v3 = new THREE.Vector3();
                for (let i = 0; i < pos.count; i++){
                    v3.fromBufferAttribute(pos, i);
                    ringGeo.attributes.uv.setXY(i, v3.length() < (data.rings.inner + data.rings.outer)/2 ? 0 : 1, 1);
                }
                const ringMat = new THREE.MeshStandardMaterial({ map: data.rings.texture, side: THREE.DoubleSide, transparent: true, opacity: 0.85, roughness: 0.3 });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI / 2 + 0.2;
                mesh.add(ringMesh);
            }

            scene.add(mesh);
            interactableObjects.push(mesh);

            const moonInstances = [];
            if (data.moons) {
                data.moons.forEach(mdata => {
                    const moonPoints = [];
                    for (let j = 0; j <= 64; j++) {
                        const mAngle = (j / 64) * Math.PI * 2;
                        moonPoints.push(new THREE.Vector3(Math.cos(mAngle) * mdata.distance, 0, Math.sin(mAngle) * mdata.distance));
                    }
                    const moonPathGeo = new THREE.BufferGeometry().setFromPoints(moonPoints);
                    const moonOrbitLine = new THREE.Line(moonPathGeo, new THREE.LineBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.3 }));
                    scene.add(moonOrbitLine);
                    orbitLines.push(moonOrbitLine);

                    const moonMat = new THREE.MeshStandardMaterial({ map: moonTexture, roughness: 0.8 });
                    const moonMesh = new THREE.Mesh(sphereGeo, moonMat);
                    moonMesh.scale.setScalar(mdata.radius);
                    moonMesh.userData = { name: mdata.name, radius: mdata.radius, isMoon: true, planetName: data.name };

                    scene.add(moonMesh);
                    interactableObjects.push(moonMesh);

                    const moonObj = { ...mdata, mesh: moonMesh, orbitLine: moonOrbitLine, angle: Math.random() * Math.PI * 2 };
                    moonInstances.push(moonObj);
                    allMoons.push(moonObj);
                });
            }

            planets.push({ ...data, mesh: mesh, angle: startAngle, lastPos: mesh.position.clone(), moons: moonInstances });
        });

        // ==========================================
        // 5. DYNAMIC LOD SPACE FABRIC (RELATIVITY)
        // ==========================================
        const fabricSize = 3000;
        let currentFabricSegments = -1; // Track segment state to prevent redundant geometry rebuilding
        let spaceFabricMesh = null;
        let fabricMat = new THREE.MeshBasicMaterial({
            color: 0x8b5cf6,
            wireframe: true,
            transparent: true,
            opacity: 0.35
        });

        function rebuildFabricGeometry(segments) {
            if (currentFabricSegments === segments) return;
            currentFabricSegments = segments;

            if (spaceFabricMesh) {
                scene.remove(spaceFabricMesh);
                spaceFabricMesh.geometry.dispose();
            }

            const fabricGeo = new THREE.PlaneGeometry(fabricSize, fabricSize, segments, segments);
            fabricGeo.rotateX(-Math.PI / 2);

            spaceFabricMesh = new THREE.Mesh(fabricGeo, fabricMat);
            spaceFabricMesh.visible = document.getElementById('toggle-fabric').checked;
            scene.add(spaceFabricMesh);

            document.getElementById('fabric-poly-info').innerText = `Polys: ${segments}x${segments}`;
        }

        // Initialize with default medium segments
        rebuildFabricGeometry(80);

        function updateSpaceFabric() {
            if (!spaceFabricMesh || !spaceFabricMesh.visible) return;

            // DYNAMIC LOD BASED ON CAMERA DISTANCE
            const camDist = camera.position.distanceTo(controls.target);
            let targetSegments = 60; // Far view: Low polys (high performance)
            if (camDist < 600) targetSegments = 100; // Medium view
            if (camDist < 200) targetSegments = 140; // Close-up view: High polys (detailed curvature)

            rebuildFabricGeometry(targetSegments);

            const fabricPositions = spaceFabricMesh.geometry.attributes.position;
            const posArray = fabricPositions.array;
            
            for (let i = 0; i < fabricPositions.count; i++) {
                const vx = posArray[i * 3];
                const vz = posArray[i * 3 + 2];

                let totalDepression = 0;
                const distToSunSq = vx * vx + vz * vz;
                totalDepression += (sunMass * 800) / (distToSunSq + 1200);

                planets.forEach(p => {
                    const dx = vx - p.mesh.position.x;
                    const dz = vz - p.mesh.position.z;
                    const distSq = dx * dx + dz * dz;
                    totalDepression += (p.mass * 350) / (distSq + 250);
                });

                posArray[i * 3 + 1] = -totalDepression;
            }
            fabricPositions.needsUpdate = true;
        }

        // ==========================================
        // 6. CONTROLS & UI LOGIC
        // ==========================================
        let isPlaying = true;
        let timeScale = 1.0;
        let currentTarget = null; 
        let isAnimatingCamera = false;

        const btnPlayPause = document.getElementById('btn-play-pause');
        const sliderSpeed = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        const toggleOrbits = document.getElementById('toggle-orbits');
        const toggleFabric = document.getElementById('toggle-fabric');
        const planetSelect = document.getElementById('planet-select');

        const zoomSlider = document.getElementById('zoom-slider');
        const zoomDisplay = document.getElementById('zoom-display');
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');

        function stopCameraTweens() {
            gsap.killTweensOf(camera.position);
            gsap.killTweensOf(controls.target);
            isAnimatingCamera = false;
            currentTarget = null;
        }

        function setZoomDistance(newDistance) {
            stopCameraTweens();
            const direction = new THREE.Vector3().subVectors(camera.position, controls.target);
            if (direction.lengthSq() === 0) direction.set(0, 0, 1);
            direction.normalize();

            camera.position.copy(controls.target).addScaledVector(direction, newDistance);
            controls.update();
            updateZoomUI(newDistance);
        }

        function updateZoomUI(distance) {
            const roundedDist = Math.round(distance);
            zoomSlider.value = roundedDist;
            zoomDisplay.innerText = roundedDist;
        }

        zoomSlider.addEventListener('input', (e) => setZoomDistance(parseFloat(e.target.value)));

        btnZoomIn.addEventListener('click', () => {
            const currentDist = camera.position.distanceTo(controls.target);
            setZoomDistance(Math.max(10, currentDist * 0.75));
        });

        btnZoomOut.addEventListener('click', () => {
            const currentDist = camera.position.distanceTo(controls.target);
            setZoomDistance(Math.min(3500, currentDist * 1.3));
        });

        controls.addEventListener('change', () => {
            const currentDist = camera.position.distanceTo(controls.target);
            updateZoomUI(currentDist);
        });

        controls.addEventListener('start', () => stopCameraTweens());

        btnPlayPause.addEventListener('click', () => {
            isPlaying = !isPlaying;
            btnPlayPause.innerText = isPlaying ? "Pause" : "Play";
            btnPlayPause.className = isPlaying 
                ? "bg-blue-600 hover:bg-blue-500 active:scale-95 text-white px-4 py-1.5 rounded-md transition-all w-20 text-center font-semibold"
                : "bg-amber-600 hover:bg-amber-500 active:scale-95 text-white px-4 py-1.5 rounded-md transition-all w-20 text-center font-semibold";
        });

        sliderSpeed.addEventListener('input', (e) => {
            timeScale = parseFloat(e.target.value);
            speedDisplay.innerText = timeScale.toFixed(1) + "x";
        });

        toggleOrbits.addEventListener('change', (e) => {
            orbitLines.forEach(line => line.visible = e.target.checked);
        });

        toggleFabric.addEventListener('change', (e) => {
            if (spaceFabricMesh) spaceFabricMesh.visible = e.target.checked;
        });

        planetSelect.addEventListener('change', (e) => focusOnTarget(e.target.value));

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.target.closest('#ui-panel')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactableObjects);
            
            if (intersects.length > 0) {
                const name = intersects[0].object.userData.name;
                planetSelect.value = name;
                focusOnTarget(name);
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function focusOnTarget(targetName) {
            stopCameraTweens();
            isAnimatingCamera = true;
            
            let endPos, targetLookAt;

            if (targetName === 'System') {
                endPos = new THREE.Vector3(0, 500, 1200);
                targetLookAt = new THREE.Vector3(0, 0, 0);
            } else if (targetName === 'Sun') {
                endPos = new THREE.Vector3(0, 40, 100);
                targetLookAt = new THREE.Vector3(0, 0, 0);
            } else {
                let obj = planets.find(p => p.name === targetName);
                if (!obj) obj = allMoons.find(m => m.name === targetName);

                if (!obj) return;
                
                const targetRadius = obj.radius;
                const offset = new THREE.Vector3(targetRadius * 4, targetRadius * 2, targetRadius * 5);
                
                endPos = obj.mesh.position.clone().add(offset);
                targetLookAt = obj.mesh.position.clone();
            }

            gsap.to(controls.target, {
                x: targetLookAt.x, y: targetLookAt.y, z: targetLookAt.z,
                duration: 1.4,
                ease: "power2.inOut",
                onComplete: () => {
                    if (targetName !== 'System' && targetName !== 'Sun') {
                        currentTarget = targetName;
                    }
                    isAnimatingCamera = false;
                }
            });

            gsap.to(camera.position, {
                x: endPos.x, y: endPos.y, z: endPos.z,
                duration: 1.4,
                ease: "power2.inOut",
                onUpdate: () => {
                    const dist = camera.position.distanceTo(controls.target);
                    updateZoomUI(dist);
                }
            });
        }

        // ==========================================
        // 7. ANIMATION LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            sunGroup.rotation.y += 0.002 * timeScale;
            sunGlowOuter.rotation.y -= 0.003 * timeScale;

            planets.forEach(p => {
                if (isPlaying) {
                    p.angle += p.speed * timeScale;
                    p.mesh.position.set(
                        Math.cos(p.angle) * p.distance,
                        0,
                        Math.sin(p.angle) * p.distance
                    );
                }
                
                p.mesh.rotation.y += p.rotSpeed * timeScale;

                p.moons.forEach(m => {
                    if (isPlaying) {
                        m.angle += m.speed * timeScale;
                    }
                    
                    m.mesh.position.set(
                        p.mesh.position.x + Math.cos(m.angle) * m.distance,
                        p.mesh.position.y,
                        p.mesh.position.z + Math.sin(m.angle) * m.distance
                    );

                    m.orbitLine.position.copy(p.mesh.position);
                    m.mesh.rotation.y += 0.01 * timeScale;
                });

                if (currentTarget === p.name && !isAnimatingCamera) {
                    const delta = p.mesh.position.clone().sub(p.lastPos);
                    camera.position.add(delta);
                    controls.target.copy(p.mesh.position);
                }

                p.lastPos.copy(p.mesh.position);
            });

            if (currentTarget && !isAnimatingCamera) {
                const activeMoon = allMoons.find(m => m.name === currentTarget);
                if (activeMoon) {
                    controls.target.copy(activeMoon.mesh.position);
                }
            }

            // Update space fabric gravity deformation & dynamic polygons
            updateSpaceFabric();

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
