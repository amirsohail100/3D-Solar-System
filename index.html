<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Hierarchy - Interactive 3D Universe</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- GSAP for Smooth Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000003; color: white; user-select: none; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        .glass-panel {
            background: rgba(8, 12, 24, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.6);
        }

        /* Collapsed Panel State */
        #ui-panel.collapsed {
            transform: translateX(-110%);
            opacity: 0;
            pointer-events: none;
        }
        
        select option { background: #0f172a; color: white; }
    </style>
</head>
<body>

    <!-- FLOATING TOGGLE MENU BUTTON (Always visible on screen top-left) -->
    <button id="btn-toggle-menu" class="glass-panel absolute top-5 left-5 z-20 px-3.5 py-2.5 rounded-xl text-white hover:bg-blue-600/40 active:scale-95 transition-all flex items-center gap-2 font-semibold text-xs border border-white/20 shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <span>Toggle Menu</span>
    </button>

    <!-- COMPACT UI PANEL -->
    <div id="ui-panel" class="glass-panel absolute top-20 left-5 w-80 rounded-2xl p-5 z-10 transition-all duration-300 max-h-[85vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-3">
            <div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-purple-300 to-pink-400">Cosmic Hierarchy</h1>
                <p class="text-[11px] text-gray-400" id="tier-indicator">Current Scale: Solar System</p>
            </div>
            <button id="btn-close-menu" class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-white/10 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- ACTIVE TARGET INDICATOR -->
        <div class="mb-4 p-2.5 rounded-xl bg-blue-950/40 border border-blue-500/30 flex items-center justify-between">
            <div>
                <span class="text-[9px] uppercase tracking-wider text-blue-400 font-semibold block">Active View Focus</span>
                <span id="active-target-name" class="text-sm font-bold text-white">Full Solar System</span>
            </div>
            <div class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse shadow-[0_0_8px_#3b82f6]"></div>
        </div>

        <!-- Controls Container -->
        <div class="space-y-3.5 text-xs">
            
            <!-- Focus Target Dropdown -->
            <div>
                <label class="block text-gray-300 mb-1 font-medium">Select Hierarchy & Target</label>
                <select id="planet-select" class="w-full bg-white/10 border border-white/20 rounded-lg px-2.5 py-1.5 text-white outline-none focus:border-blue-400 transition-colors cursor-pointer font-medium">
                    <optgroup label="✨ Multiverse Scale">
                        <option value="Multiverse">🌌 Multiverse Domains</option>
                    </optgroup>
                    <optgroup label="🌀 Galaxy Scale">
                        <option value="MilkyWay">🌀 Milky Way Galaxy</option>
                    </optgroup>
                    <optgroup label="🪐 Solar System Scale">
                        <option value="System">Full Solar System</option>
                        <option value="Sun">☀️ The Sun</option>
                        <option value="Mercury">🪐 Mercury</option>
                        <option value="Venus">🪐 Venus</option>
                        <option value="Earth">🌍 Earth</option>
                        <option value="Mars">🪐 Mars</option>
                        <option value="Jupiter">🪐 Jupiter</option>
                        <option value="Saturn">🪐 Saturn</option>
                        <option value="Uranus">🪐 Uranus</option>
                        <option value="Neptune">🪐 Neptune</option>
                    </optgroup>
                </select>
            </div>

            <!-- ZOOM SLIDER & BUTTONS -->
            <div>
                <div class="flex justify-between text-gray-300 mb-1">
                    <label class="font-medium">Camera Distance / Scale</label>
                    <span id="zoom-display" class="font-mono text-blue-300">1200</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-zoom-in" title="Zoom In" class="bg-white/10 hover:bg-blue-600 active:scale-95 text-white w-8 h-7 rounded-lg border border-white/20 font-bold transition-all flex items-center justify-center">+</button>
                    <input type="range" id="zoom-slider" min="2" max="35000" value="1200" class="w-full accent-blue-500 cursor-pointer h-1.5 bg-white/20 rounded-lg appearance-none">
                    <button id="btn-zoom-out" title="Zoom Out" class="bg-white/10 hover:bg-blue-600 active:scale-95 text-white w-8 h-7 rounded-lg border border-white/20 font-bold transition-all flex items-center justify-center">-</button>
                </div>
            </div>

            <!-- Play / Pause -->
            <div class="flex items-center justify-between">
                <span class="text-gray-300 font-medium">Orbital Motion</span>
                <button id="btn-play-pause" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white px-3 py-1 rounded-md transition-all w-16 text-center font-semibold">Pause</button>
            </div>

            <!-- Simulation Speed Slider -->
            <div>
                <div class="flex justify-between text-gray-300 mb-1">
                    <label class="font-medium">Simulation Speed</label>
                    <span id="speed-display" class="font-mono text-blue-300">1.0x</span>
                </div>
                <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1" class="w-full accent-blue-500 cursor-pointer">
            </div>

            <!-- Show/Hide Orbit Lines -->
            <div class="flex items-center justify-between">
                <span class="text-gray-300 font-medium">Show Orbit Lines</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="toggle-orbits" class="sr-only peer" checked>
                    <div class="w-9 h-5 bg-gray-700 rounded-full peer peer-checked:bg-blue-500 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
                </label>
            </div>

            <!-- SPACE FABRIC TOGGLE -->
            <div class="flex items-center justify-between pt-2 border-t border-white/10">
                <div>
                    <span class="text-purple-300 font-semibold block">Space Fabric Grid</span>
                    <span class="text-[9px] text-gray-400 block" id="fabric-poly-info">HD Polys: 120x120</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="toggle-fabric" class="sr-only peer" checked>
                    <div class="w-9 h-5 bg-gray-700 rounded-full peer peer-checked:bg-purple-600 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all"></div>
                </label>
            </div>
        </div>

        <div class="mt-4 pt-2.5 border-t border-white/10 text-[10px] text-gray-400 space-y-1">
            <p>✨ <b>Dynamic Galaxy Fill:</b> Fades out on zoom-in</p>
            <p>🔘 <b>Toggle Menu:</b> Click button top-left to hide/show</p>
        </div>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==========================================
        // 1. PROCEDURAL TEXTURES
        // ==========================================
        function createSunTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 1024);
            grad.addColorStop(0, '#ff3300'); grad.addColorStop(0.5, '#ff9900'); grad.addColorStop(1, '#ff2200');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 2048, 1024);
            for(let i=0; i<8000; i++) {
                ctx.fillStyle = Math.random() > 0.4 ? 'rgba(255,255,200,0.35)' : 'rgba(180,20,0,0.3)';
                ctx.beginPath(); ctx.arc(Math.random()*2048, Math.random()*1024, Math.random()*16 + 2, 0, Math.PI*2); ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createMercuryTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#7a7a7a'; ctx.fillRect(0, 0, 1024, 512);
            for(let i = 0; i < 5000; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(40,40,40,0.35)' : 'rgba(220,220,220,0.35)';
                ctx.beginPath(); ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*7 + 1, 0, Math.PI*2); ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createVenusTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0, '#d49b42'); grad.addColorStop(0.5, '#f3cb78'); grad.addColorStop(1, '#b87d32');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 512);
            ctx.fillStyle = 'rgba(255, 255, 200, 0.25)';
            for(let i=0; i<80; i++) {
                ctx.beginPath(); ctx.ellipse(Math.random()*1024, Math.random()*512, Math.random()*400+100, Math.random()*15+5, Math.random()*0.3, 0, Math.PI*2); ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0f3868'; ctx.fillRect(0, 0, 2048, 1024);
            ctx.fillStyle = '#1e6b32';
            for(let i=0; i<300; i++) {
                ctx.beginPath(); ctx.ellipse(Math.random()*2048, 150 + Math.random()*724, Math.random()*150+30, Math.random()*90+20, Math.random()*Math.PI, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            for(let i=0; i<150; i++) {
                ctx.beginPath(); ctx.ellipse(Math.random()*2048, Math.random()*1024, Math.random()*200+40, Math.random()*18+6, Math.random()*0.4, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 2048, 50); ctx.fillRect(0, 974, 2048, 50);
            return new THREE.CanvasTexture(canvas);
        }

        function createMarsTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#bf4311'; ctx.fillRect(0, 0, 1024, 512);
            ctx.fillStyle = 'rgba(50, 15, 5, 0.45)';
            for(let i=0; i<350; i++) {
                ctx.beginPath(); ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*50+10, 0, Math.PI*2); ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createJupiterTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            const bands = ['#c8b193', '#8c6d4f', '#d6bfa4', '#9e734c', '#e6d5bc', '#6b4d33'];
            for(let y=0; y<1024; y+=12) {
                ctx.fillStyle = bands[Math.floor(y/12) % bands.length];
                ctx.fillRect(0, y, 2048, 12);
            }
            ctx.fillStyle = '#b83211';
            ctx.beginPath(); ctx.ellipse(1300, 640, 110, 65, -0.1, 0, Math.PI*2); ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        function createSaturnTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            const bands = ['#e3cca8', '#c2a882', '#d9c29c', '#b0936b', '#eddcbf'];
            for(let y=0; y<1024; y+=10) {
                ctx.fillStyle = bands[Math.floor(y/10) % bands.length];
                ctx.fillRect(0, y, 2048, 10);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createSaturnRingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 1024, 0);
            grad.addColorStop(0.0, 'rgba(210, 190, 150, 0.0)');
            grad.addColorStop(0.2, 'rgba(230, 210, 170, 0.95)');
            grad.addColorStop(0.5, 'rgba(180, 160, 120, 0.9)');
            grad.addColorStop(0.6, 'rgba(20, 20, 20, 0.3)');
            grad.addColorStop(0.7, 'rgba(210, 190, 150, 0.85)');
            grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1);
            return new THREE.CanvasTexture(canvas);
        }

        function createUranusTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0, '#5da1f8'); grad.addColorStop(0.5, '#85ccf7'); grad.addColorStop(1, '#5da1f8');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 512);
            return new THREE.CanvasTexture(canvas);
        }

        function createNeptuneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0, '#1f48c7'); grad.addColorStop(0.5, '#3563e3'); grad.addColorStop(1, '#1f48c7');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 512);
            return new THREE.CanvasTexture(canvas);
        }

        // ==========================================
        // 2. SCENE & LIGHTING SETUP
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.05, 50000);
        camera.position.set(0, 500, 1200);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.5;
        controls.zoomSpeed = 0.4;
        controls.minDistance = 2;
        controls.maxDistance = 35000;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x222244, 0.6);
        scene.add(hemiLight);

        const sunLight = new THREE.PointLight(0xffffff, 28000, 8000);
        scene.add(sunLight);

        // ==========================================
        // 3. GALAXY WITH DENSE INTER-ARM STARS (SPRINKLES FILLED)
        // ==========================================
        const hierarchyGroup = new THREE.Group();
        scene.add(hierarchyGroup);

        const galaxyGroup = new THREE.Group();
        galaxyGroup.position.set(0, 0, 0);
        
        const galaxyParticleCount = 28000; // Increased count to fill gaps between arms completely
        const galaxyGeo = new THREE.BufferGeometry();
        const galaxyPositions = new Float32Array(galaxyParticleCount * 3);
        const galaxyColors = new Float32Array(galaxyParticleCount * 3);

        for (let i = 0; i < galaxyParticleCount; i++) {
            // Fill both arms and intermediate sprinkle areas uniformly
            const radius = 1000 + Math.random() * 9500; 
            const spinAngle = radius * 0.0006;
            const branchAngle = ((i % 5) / 5) * Math.PI * 2;
            const sprinkleSpread = (Math.random() - 0.5) * 1.5; // Fills the gaps
            const currentAngle = branchAngle + spinAngle + sprinkleSpread;
            
            galaxyPositions[i * 3] = Math.cos(currentAngle) * radius;
            galaxyPositions[i * 3 + 1] = (Math.random() - 0.5) * (350 + radius * 0.025);
            galaxyPositions[i * 3 + 2] = Math.sin(currentAngle) * radius;

            const mixedColor = new THREE.Color();
            if (i % 5 === 0) {
                mixedColor.setHex(0xffffff); // Bright sprinkle stars
            } else if (radius < 2500) {
                mixedColor.setHex(0xfffaed);
            } else if (Math.random() > 0.4) {
                mixedColor.setHex(0x60a5fa);
            } else {
                mixedColor.setHex(0xc084fc);
            }

            galaxyColors[i * 3] = mixedColor.r;
            galaxyColors[i * 3 + 1] = mixedColor.g;
            galaxyColors[i * 3 + 2] = mixedColor.b;
        }

        galaxyGeo.setAttribute('position', new THREE.BufferAttribute(galaxyPositions, 3));
        galaxyGeo.setAttribute('color', new THREE.BufferAttribute(galaxyColors, 3));

        const galaxyMat = new THREE.PointsMaterial({
            size: 7,
            vertexColors: true,
            transparent: true,
            opacity: 0.0, // Fades out on zoom in, fades in on zoom out
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const milkyWayMesh = new THREE.Points(galaxyGeo, galaxyMat);
        milkyWayMesh.userData = { name: 'MilkyWay', scaleTier: 'Galaxy' };
        galaxyGroup.add(milkyWayMesh);
        hierarchyGroup.add(galaxyGroup);

        // Multiverse Domains
        const multiverseGroup = new THREE.Group();
        const multiverseGeom = new THREE.SphereGeometry(700, 32, 32);
        
        for (let i = 0; i < 12; i++) {
            const mMat = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(Math.random(), 0.85, 0.65),
                wireframe: true,
                transparent: true,
                opacity: 0.0 
            });
            const mMesh = new THREE.Mesh(multiverseGeom, mMat);
            const dist = 22000 + Math.random() * 10000;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;
            
            mMesh.position.set(
                dist * Math.sin(phi) * Math.cos(theta),
                dist * Math.sin(phi) * Math.sin(theta),
                dist * Math.cos(phi)
            );
            mMesh.userData = { name: 'Multiverse', scaleTier: 'Multiverse' };
            multiverseGroup.add(mMesh);
        }
        hierarchyGroup.add(multiverseGroup);

        // ==========================================
        // 4. GENERAL STARFIELD
        // ==========================================
        const starsCount = 15000;
        const starsGeo = new THREE.BufferGeometry();
        const posArray = new Float32Array(starsCount * 3);
        const colorArray = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount; i++) {
            const r = 8000 + Math.random() * 25000;
            const theta = 2 * Math.PI * Math.random();
            const phi = Math.acos(2 * Math.random() - 1);

            posArray[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            posArray[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            posArray[i * 3 + 2] = r * Math.cos(phi);

            const color = new THREE.Color();
            const p = Math.random();
            if (p > 0.8) color.setHex(0x93c5fd);
            else if (p > 0.6) color.setHex(0xfde047);
            else color.setHex(0xffffff);

            colorArray[i * 3] = color.r;
            colorArray[i * 3 + 1] = color.g;
            colorArray[i * 3 + 2] = color.b;
        }

        starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        starsGeo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

        const starsMat = new THREE.PointsMaterial({
            size: 3.0,
            sizeAttenuation: true,
            vertexColors: true,
            transparent: true,
            opacity: 0.95,
            depthWrite: false
        });

        const starMesh = new THREE.Points(starsGeo, starsMat);
        scene.add(starMesh);

        // ==========================================
        // 5. SOLAR SYSTEM OBJECTS & ORBITS
        // ==========================================
        const sphereGeo = new THREE.SphereGeometry(1, 64, 64);
        const interactableObjects = [];
        const orbitLines = [];

        const sunRadius = 25;
        const sunMass = 120;
        const sunGroup = new THREE.Group();
        const sunMat = new THREE.MeshBasicMaterial({ map: createSunTexture() });
        const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(sunRadius, 64, 64), sunMat);
        sunMesh.userData = { name: 'Sun', radius: sunRadius, mass: sunMass, scaleTier: 'SolarSystem' };
        sunGroup.add(sunMesh);
        interactableObjects.push(sunMesh);

        const glowMat = new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, side: THREE.BackSide, depthWrite: false });
        const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(sunRadius + 4, 64, 64), glowMat);
        const sunGlowOuter = new THREE.Mesh(new THREE.SphereGeometry(sunRadius + 14, 64, 64), 
            new THREE.MeshBasicMaterial({ color: 0xff2200, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending, side: THREE.BackSide, depthWrite: false })
        );
        sunGroup.add(sunGlow); sunGroup.add(sunGlowOuter);
        scene.add(sunGroup);

        const planetsData = [
            { name: 'Mercury', radius: 1.2, distance: 75, mass: 15, speed: 0.035, rotSpeed: 0.01, texture: createMercuryTexture(), roughness: 0.6 },
            { name: 'Venus', radius: 2.2, distance: 110, mass: 22, speed: 0.022, rotSpeed: -0.004, texture: createVenusTexture(), roughness: 0.3 },
            { name: 'Earth', radius: 2.5, distance: 150, mass: 25, speed: 0.015, rotSpeed: 0.02, texture: createEarthTexture(), roughness: 0.25 },
            { name: 'Mars', radius: 1.6, distance: 210, mass: 18, speed: 0.011, rotSpeed: 0.018, texture: createMarsTexture(), roughness: 0.65 },
            { name: 'Jupiter', radius: 9.0, distance: 420, mass: 65, speed: 0.005, rotSpeed: 0.04, texture: createJupiterTexture(), roughness: 0.4 },
            { 
                name: 'Saturn', radius: 7.5, distance: 650, mass: 50, speed: 0.003, rotSpeed: 0.038, texture: createSaturnTexture(), roughness: 0.35,
                rings: { inner: 10, outer: 20, texture: createSaturnRingTexture() }
            },
            { name: 'Uranus', radius: 4.5, distance: 1000, mass: 35, speed: 0.0018, rotSpeed: -0.03, texture: createUranusTexture(), roughness: 0.3, rings: { inner: 6, outer: 9, texture: createSaturnRingTexture() } },
            { name: 'Neptune', radius: 4.2, distance: 1350, mass: 35, speed: 0.001, rotSpeed: 0.032, texture: createNeptuneTexture(), roughness: 0.3 }
        ];

        const planets = [];

        planetsData.forEach(data => {
            const points = [];
            for (let i = 0; i <= 300; i++) {
                const angle = (i / 300) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(angle) * data.distance, 0, Math.sin(angle) * data.distance));
            }
            const pathGeo = new THREE.BufferGeometry().setFromPoints(points);
            const orbitLine = new THREE.Line(pathGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25, depthWrite: false }));
            scene.add(orbitLine);
            orbitLines.push(orbitLine);

            const mat = new THREE.MeshStandardMaterial({ map: data.texture, roughness: data.roughness, metalness: 0.05 });
            const mesh = new THREE.Mesh(sphereGeo, mat);
            mesh.scale.setScalar(data.radius);
            mesh.userData = { name: data.name, radius: data.radius, mass: data.mass, scaleTier: 'SolarSystem' };
            
            const startAngle = Math.random() * Math.PI * 2;
            mesh.position.set(Math.cos(startAngle) * data.distance, 0, Math.sin(startAngle) * data.distance);

            if (data.rings) {
                const ringGeo = new THREE.RingGeometry(data.rings.inner, data.rings.outer, 80);
                let pos = ringGeo.attributes.position;
                let v3 = new THREE.Vector3();
                for (let i = 0; i < pos.count; i++){
                    v3.fromBufferAttribute(pos, i);
                    ringGeo.attributes.uv.setXY(i, v3.length() < (data.rings.inner + data.rings.outer)/2 ? 0 : 1, 1);
                }
                const ringMat = new THREE.MeshStandardMaterial({ map: data.rings.texture, side: THREE.DoubleSide, transparent: true, opacity: 0.9, roughness: 0.25, depthWrite: false });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI / 2 + 0.15;
                mesh.add(ringMesh);
            }

            scene.add(mesh);
            interactableObjects.push(mesh);
            planets.push({ ...data, mesh: mesh, angle: startAngle, lastPos: mesh.position.clone() });
        });

        // ==========================================
        // 6. SPACE FABRIC
        // ==========================================
        const fabricSize = 3500;
        let currentFabricSegments = -1;
        let spaceFabricMesh = null;
        let fabricMat = new THREE.MeshBasicMaterial({
            color: 0xa855f7,
            wireframe: true,
            transparent: true,
            opacity: 0.35,
            depthWrite: false
        });

        function rebuildFabricGeometry(segments) {
            if (currentFabricSegments === segments) return;
            currentFabricSegments = segments;

            if (spaceFabricMesh) {
                scene.remove(spaceFabricMesh);
                spaceFabricMesh.geometry.dispose();
            }

            const fabricGeo = new THREE.PlaneGeometry(fabricSize, fabricSize, segments, segments);
            fabricGeo.rotateX(-Math.PI / 2);

            spaceFabricMesh = new THREE.Mesh(fabricGeo, fabricMat);
            spaceFabricMesh.visible = document.getElementById('toggle-fabric').checked;
            scene.add(spaceFabricMesh);

            document.getElementById('fabric-poly-info').innerText = `HD Polys: ${segments}x${segments}`;
        }

        rebuildFabricGeometry(120);

        function updateSpaceFabric() {
            if (!spaceFabricMesh || !spaceFabricMesh.visible) return;
            const fabricPositions = spaceFabricMesh.geometry.attributes.position;
            const posArray = fabricPositions.array;
            
            for (let i = 0; i < fabricPositions.count; i++) {
                const vx = posArray[i * 3];
                const vz = posArray[i * 3 + 2];

                let totalDepression = 0;
                const distToSunSq = vx * vx + vz * vz;
                totalDepression += (sunMass * 900) / (distToSunSq + 1400);

                planets.forEach(p => {
                    const dx = vx - p.mesh.position.x;
                    const dz = vz - p.mesh.position.z;
                    const distSq = dx * dx + dz * dz;
                    totalDepression += (p.mass * 400) / (distSq + 300);
                });

                posArray[i * 3 + 1] = -totalDepression;
            }
            fabricPositions.needsUpdate = true;
        }

        // ==========================================
        // 7. CONTROLS, TOGGLE MENU & ZOOM LOGIC
        // ==========================================
        let isPlaying = true;
        let timeScale = 1.0;
        let currentTarget = null; 
        let isAnimatingCamera = false;

        const uiPanel = document.getElementById('ui-panel');
        const btnToggleMenu = document.getElementById('btn-toggle-menu');
        const btnCloseMenu = document.getElementById('btn-close-menu');

        // Menu Toggle functionality
        btnToggleMenu.addEventListener('click', () => uiPanel.classList.toggle('collapsed'));
        btnCloseMenu.addEventListener('click', () => uiPanel.classList.add('collapsed'));

        const btnPlayPause = document.getElementById('btn-play-pause');
        const sliderSpeed = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        const toggleOrbits = document.getElementById('toggle-orbits');
        const toggleFabric = document.getElementById('toggle-fabric');
        const planetSelect = document.getElementById('planet-select');
        const activeTargetName = document.getElementById('active-target-name');
        const tierIndicator = document.getElementById('tier-indicator');

        const zoomSlider = document.getElementById('zoom-slider');
        const zoomDisplay = document.getElementById('zoom-display');
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');

        function stopCameraTweens() {
            gsap.killTweensOf(camera.position);
            gsap.killTweensOf(controls.target);
            isAnimatingCamera = false;
        }

        function setZoomDistance(newDistance) {
            stopCameraTweens();
            const direction = new THREE.Vector3().subVectors(camera.position, controls.target);
            if (direction.lengthSq() === 0) direction.set(0, 0, 1);
            direction.normalize();

            camera.position.copy(controls.target).addScaledVector(direction, newDistance);
            controls.update();
            updateZoomUI(newDistance);
        }

        function updateZoomUI(distance) {
            const roundedDist = Math.round(distance);
            zoomSlider.value = roundedDist;
            zoomDisplay.innerText = roundedDist;

            // Zoom-based Galaxy & Stars Visibility Logic (Disappears on Zoom-In, appears on Zoom-Out)
            if (roundedDist > 12000) {
                tierIndicator.innerText = "Current Scale: Multiverse Tier";
                galaxyMat.opacity = 1.0;
                multiverseGroup.children.forEach(m => m.material.opacity = Math.min(0.4, (roundedDist - 12000) / 10000));
            } else if (roundedDist > 2500) {
                tierIndicator.innerText = "Current Scale: Galaxy Tier (Milky Way)";
                // Smooth fade-in when zooming out, fade-out when zooming into solar system
                galaxyMat.opacity = Math.max(0.0, Math.min(0.95, (roundedDist - 2500) / 7500));
                multiverseGroup.children.forEach(m => m.material.opacity = 0);
            } else {
                tierIndicator.innerText = "Current Scale: Solar System Tier";
                galaxyMat.opacity = 0; // Completely disappears on close zoom-in inside solar system
                multiverseGroup.children.forEach(m => m.material.opacity = 0);
            }
        }

        zoomSlider.addEventListener('input', (e) => setZoomDistance(parseFloat(e.target.value)));

        btnZoomIn.addEventListener('click', () => {
            const currentDist = camera.position.distanceTo(controls.target);
            setZoomDistance(Math.max(2, currentDist * 0.7));
        });

        btnZoomOut.addEventListener('click', () => {
            const currentDist = camera.position.distanceTo(controls.target);
            setZoomDistance(Math.min(35000, currentDist * 1.4));
        });

        controls.addEventListener('change', () => {
            const currentDist = camera.position.distanceTo(controls.target);
            updateZoomUI(currentDist);
        });

        controls.addEventListener('start', () => stopCameraTweens());

        btnPlayPause.addEventListener('click', () => {
            isPlaying = !isPlaying;
            btnPlayPause.innerText = isPlaying ? "Pause" : "Play";
            btnPlayPause.className = isPlaying 
                ? "bg-blue-600 hover:bg-blue-500 active:scale-95 text-white px-3 py-1 rounded-md transition-all w-16 text-center font-semibold"
                : "bg-amber-600 hover:bg-amber-500 active:scale-95 text-white px-3 py-1 rounded-md transition-all w-16 text-center font-semibold";
        });

        sliderSpeed.addEventListener('input', (e) => {
            timeScale = parseFloat(e.target.value);
            speedDisplay.innerText = timeScale.toFixed(1) + "x";
        });

        toggleOrbits.addEventListener('change', (e) => {
            orbitLines.forEach(line => line.visible = e.target.checked);
        });

        toggleFabric.addEventListener('change', (e) => {
            if (spaceFabricMesh) spaceFabricMesh.visible = e.target.checked;
        });

        planetSelect.addEventListener('change', (e) => focusOnTarget(e.target.value));

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.target.closest('#ui-panel') || event.target.closest('#btn-toggle-menu')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactableObjects);
            
            if (intersects.length > 0) {
                const name = intersects[0].object.userData.name;
                planetSelect.value = name;
-               focusOnTarget(name);
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function focusOnTarget(targetName) {
            stopCameraTweens();
            isAnimatingCamera = true;
            
            let endPos, targetLookAt;
            let displayName = targetName;

            if (targetName === 'Multiverse') {
                endPos = new THREE.Vector3(0, 8000, 26000);
                targetLookAt = new THREE.Vector3(0, 0, 0);
                displayName = "Multiverse Domains";
                currentTarget = null;
            } else if (targetName === 'MilkyWay') {
                endPos = new THREE.Vector3(0, 2500, 8000);
                targetLookAt = new THREE.Vector3(0, 0, 0);
                displayName = "Milky Way Galaxy";
                currentTarget = null;
            } else if (targetName === 'System') {
                endPos = new THREE.Vector3(0, 500, 1200);
                targetLookAt = new THREE.Vector3(0, 0, 0);
                displayName = "Full Solar System";
                currentTarget = null;
            } else if (targetName === 'Sun') {
                endPos = new THREE.Vector3(0, 35, 75);
                targetLookAt = new THREE.Vector3(0, 0, 0);
                displayName = "The Sun";
                currentTarget = 'Sun';
            } else {
                let obj = planets.find(p => p.name === targetName);
                if (!obj) return;
                
                const targetRadius = obj.radius;
                const offset = new THREE.Vector3(targetRadius * 3.5, targetRadius * 1.5, targetRadius * 4.0);
                
                endPos = obj.mesh.position.clone().add(offset);
                targetLookAt = obj.mesh.position.clone();
                currentTarget = targetName;
                displayName = targetName;
            }

            activeTargetName.innerText = displayName;

            gsap.to(controls.target, {
                x: targetLookAt.x, y: targetLookAt.y, z: targetLookAt.z,
                duration: 1.5,
                ease: "power2.inOut",
                onComplete: () => { isAnimatingCamera = false; }
            });

            gsap.to(camera.position, {
                x: endPos.x, y: endPos.y, z: endPos.z,
                duration: 1.5,
                ease: "power2.inOut",
                onUpdate: () => {
                    const dist = camera.position.distanceTo(controls.target);
                    updateZoomUI(dist);
                }
            });
        }

        // ==========================================
        // 8. ANIMATION LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            starMesh.rotation.y += 0.00015 * timeScale;
            milkyWayMesh.rotation.y += 0.0004 * timeScale;
            multiverseGroup.rotation.y += 0.00008 * timeScale;

            sunGroup.rotation.y += 0.002 * timeScale;
            sunGlowOuter.rotation.y -= 0.003 * timeScale;

            planets.forEach(p => {
                if (isPlaying) {
                    p.angle += p.speed * timeScale;
                    p.mesh.position.set(
                        Math.cos(p.angle) * p.distance,
                        0,
                        Math.sin(p.angle) * p.distance
                    );
                }
                p.mesh.rotation.y += p.rotSpeed * timeScale;

                if (currentTarget === p.name && !isAnimatingCamera) {
                    const delta = p.mesh.position.clone().sub(p.lastPos);
                    camera.position.add(delta);
                    controls.target.copy(p.mesh.position);
                }
                p.lastPos.copy(p.mesh.position);
            });

            updateSpaceFabric();

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
